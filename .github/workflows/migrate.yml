name: migrate
# Manual runs only. Pushes to main migrate through the deploy workflow, right before production deploys.
on:
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only whether the secret exists; the value goes to the migrate step alone.
      HAS_DB: ${{ secrets.SUPABASE_MIGRATION_URL != '' }}
    steps:
      - name: Require the migration secret
        if: env.HAS_DB != 'true'
        run: |
          echo "::error::SUPABASE_MIGRATION_URL is not set (repo Actions secrets, Secrets tab)."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          # Supabase session pooler URI (port 5432).
          DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_URL }}
        run: pnpm --filter @backoffice-gym/db exec prisma migrate deploy
