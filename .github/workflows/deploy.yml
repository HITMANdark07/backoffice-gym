name: deploy
# Production deploys run in order: CI passes on main, then migrations, then Vercel's deploy hook.
# Vercel's own git deploys of main are off (apps/web/vercel.json), so code never ships before its migrations.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only whether the secrets exist; their values are given to the single step that needs each one,
      # so dependency install scripts never see them.
      HAS_DB: ${{ secrets.SUPABASE_MIGRATION_URL != '' }}
      HAS_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Deploy only the commit that is still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::main is now at $tip, not $SHA; that commit's own CI run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require both secrets
        if: steps.tip.outputs.current == 'true'
        run: |
          missing=0
          if [ "$HAS_DB" != "true" ]; then echo "::error::SUPABASE_MIGRATION_URL is not set (repo Actions secrets)."; missing=1; fi
          if [ "$HAS_HOOK" != "true" ]; then echo "::error::VERCEL_DEPLOY_HOOK_URL is not set (repo Actions secrets)."; missing=1; fi
          exit $missing
      - if: steps.tip.outputs.current == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.tip.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - if: steps.tip.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        if: steps.tip.outputs.current == 'true'
        env:
          # Supabase session pooler URI (port 5432).
          DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_URL }}
        run: pnpm --filter @backoffice-gym/db exec prisma migrate deploy
      - name: Deploy to Vercel
        if: steps.tip.outputs.current == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          # The hook builds main's tip at the moment it is called, so check again right before calling it.
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$SHA" ]; then
            echo "::warning::main moved to $tip during migrations; that commit's own CI run deploys it."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Vercel is building $SHA."
