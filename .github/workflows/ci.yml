name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKOFFICE_GYM_TEST_DATABASE_URL: postgresql://runner@localhost:5432/backoffice_gym_test
      BACKOFFICE_GYM_DATABASE_URL: postgresql://runner@localhost:5432/backoffice_gym_test
    steps:
      - uses: actions/checkout@v4
      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 17
          database: backoffice_gym_test
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Build the site and check every page's metadata
        run: pnpm web:build && pnpm --filter @backoffice-gym/web check
      - uses: astral-sh/setup-uv@v6
      - name: Python client
        working-directory: clients/python
        run: uv run pytest
