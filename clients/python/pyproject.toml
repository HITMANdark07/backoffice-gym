[project]
name = "backoffice-gym"
version = "0.1.0"
description = "Python client for the BackOffice Gym RL environment API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
